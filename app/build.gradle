plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.franyer98.videodownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.franyer98.videodownloader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // yt-dlp empaquetado para Android (incluye python embebido + ffmpeg)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.3'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.3'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.17.3'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
