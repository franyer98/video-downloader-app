name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK y crear version.json
        run: |
          cp app/build/outputs/apk/release/app-release.apk DescargaVideos.apk
          echo "{\"versionCode\": $((100 + GITHUB_RUN_NUMBER)), \"versionName\": \"2.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: DescargaVideos
          path: DescargaVideos.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DescargaVideos (última versión)
          body: "APK compilado automáticamente desde ${{ github.sha }}"
          files: |
            DescargaVideos.apk
            version.json
          make_latest: true
